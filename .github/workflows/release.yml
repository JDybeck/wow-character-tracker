# Push a tag like v0.8.0 and this builds WoWCharacterTracker.exe and attaches it to a GitHub Release.
# The release notes come from that version's section in CHANGELOG.md; the app shows them when it
# finds an update.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The tag sets the exe's version, so v0.8.0 builds 0.8.0.
      - name: Build WoWCharacterTracker.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish companion/WoWCharacterTracker -c Release -o dist -nologo -p:Version=$version

      # "## v0.8.0" up to the next "## " heading.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^##\s+$([regex]::Escape($tag))\b" })
          if ($start -lt 0) { "See the commits for what changed." | Set-Content notes.md; exit 0 }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^##\s' })
          if ($end -lt 0) { $end = $lines.Count }
          $lines[($start + 1)..($end - 1)] | Set-Content notes.md

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/WoWCharacterTracker.exe --title "${{ github.ref_name }}" --notes-file notes.md
