# Push a tag like v0.2.0 and this builds LevelTimes.exe and attaches it to a GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The tag sets the exe's version, so v0.2.0 builds 0.2.0.
      - name: Build LevelTimes.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish companion/LevelTimesCompanion -c Release -o dist -nologo -p:Version=$version

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/LevelTimes.exe --title "${{ github.ref_name }}" --generate-notes
