# Runs verify.cmd (build with warnings as errors, then every C# and addon test) on each pull request
# and each push to main, so a PR shows a red or green check before it's merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR replaces the run still going. Pushes to main each finish their run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: windows-latest # the app and its tests are WPF
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: verify.cmd
        shell: cmd
        run: call verify.cmd
